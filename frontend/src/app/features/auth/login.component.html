<div style="
  min-height: calc(100vh - 8rem);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem 1rem;
">
  <div style="width: 100%; max-width: 440px;" class="bp-fade-in">

    <!-- Card -->
    <div class="bp-card" style="padding: 2.5rem;">

      <!-- Header -->
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="
          width: 10.5rem; height: 10.5rem; border-radius: 0.01rem;
          background: transparent;
          display: flex; align-items: center; justify-content: center;
          color: #fff; font-weight: 800; font-size: 1.125rem;
          margin: 0 auto 1rem;
        "><img src="images/BPA logo1.png" alt=""></div>
        <h1 style="font-size: 1.5rem; font-weight: 700; margin: 0 0 0.375rem;">Welcome back</h1>
        <p style="font-size: 0.875rem; color: var(--bp-text-muted); margin: 0;">Sign in to your BuildPay Africa account
        </p>
      </div>

      <!-- Form -->
      <!-- Form -->
<form
  [formGroup]="form"
  (ngSubmit)="submit()"
  style="
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  "
>

  <!-- Email + Password Inline -->
  <div style="
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1rem;
    align-items: start;
  ">

    <!-- Email -->
    <div class="bp-form-group">

      <label class="bp-label" for="email">
        Email address
      </label>

      <input
        id="email"
        class="bp-input"
        type="email"
        formControlName="email"
        placeholder="you@example.com"
        autocomplete="email"
      />

      <span
        *ngIf="form.get('email')?.invalid && form.get('email')?.touched"
        style="
          font-size: 0.75rem;
          color: var(--bp-danger);
        "
      >
        Please enter a valid email address.
      </span>

    </div>

    <!-- Password -->
    <div class="bp-form-group">

      <label
        class="bp-label"
        for="password"
        style="margin-bottom: 0.375rem;"
      >
        Password
      </label>

      <div style="position: relative;">

        <input
          id="password"
          class="bp-input"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
          style="padding-right: 3rem;"
        />

        <!-- Visibility Toggle -->
        <button
          type="button"
          (click)="togglePassword()"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          style="
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--bp-text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
          "
        >
          <span class="material-icons" style="font-size: 1.2rem;">
            {{ showPassword() ? 'visibility_off' : 'visibility' }}
          </span>
        </button>

      </div>

      <!-- Forgot Password -->
      <div style="
        display: flex;
        justify-content: flex-end;
        margin-top: 0.45rem;
      ">
        <a
          href="#"
          style="
            font-size: 0.75rem;
            color: var(--bp-primary);
            text-decoration: none;
          "
        >
          Forgot password?
        </a>
      </div>

    </div>

  </div>

  <!-- Error -->
  <div *ngIf="error" class="bp-alert bp-alert-error">
    ⚠️ {{ error }}
  </div>

  <!-- Submit -->
  <button
    type="submit"
    class="bp-btn bp-btn-primary"
    style="
      width: 100%;
      justify-content: center;
      padding: 0.75rem;
    "
    [disabled]="form.invalid || loading"
  >

    <span
      *ngIf="loading"
      class="bp-spinner"
      style="
        width: 1rem;
        height: 1rem;
        border-width: 2px;
        border-top-color: #fff;
      "
    ></span>

    {{ loading ? 'Signing in…' : 'Sign in' }}

  </button>

</form>

      <!-- Divider -->
      <div style="display: flex; align-items: center; gap: 1rem; margin: 1.5rem 0;">
        <hr class="bp-divider" style="flex: 1; margin: 0;">
        <span style="font-size: 0.75rem; color: var(--bp-text-muted); white-space: nowrap;">or continue with</span>
        <hr class="bp-divider" style="flex: 1; margin: 0;">
      </div>

      <!-- Social Buttons -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
        <button class="bp-btn bp-btn-ghost" style="justify-content: center;" disabled title="Coming soon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              fill="#4285F4" />
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853" />
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
              fill="#FBBC05" />
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              fill="#EA4335" />
          </svg>
          Google
        </button>
        <button class="bp-btn bp-btn-ghost" style="justify-content: center;" disabled title="Coming soon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z" />
          </svg>
          GitHub
        </button>
      </div>

      <!-- Register link -->
      <p style="text-align: center; font-size: 0.875rem; color: var(--bp-text-muted); margin: 1.5rem 0 0;">
        Don't have an account?
        <a routerLink="/register" style="color: var(--bp-primary); font-weight: 600; text-decoration: none;">Create one
          free</a>
      </p>
    </div>
  </div>
</div>
