<div style="
  min-height: calc(100vh - 12rem);
  display: flex; align-items: center; justify-content: center;
  padding: 2rem 1rem;
">
  <div class="bp-card bp-fade-in" style="max-width: 480px; width: 100%; padding: 3rem 2.5rem; text-align: center;">

    <!-- Icon -->
    <div style="
      width: 5rem; height: 5rem; border-radius: 50%;
      background: #fee2e2; color: #dc2626;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.25rem; margin: 0 auto 1.5rem;
    ">🚫</div>

    <!-- Heading -->
    <h1 style="font-size: 1.5rem; font-weight: 800; margin: 0 0 0.5rem; color: var(--bp-text);">
      Access Denied
    </h1>
    <p style="font-size: 0.9375rem; color: var(--bp-text-muted); margin: 0 0 1.5rem; line-height: 1.6;">
      You don't have permission to view this page.
      This area is restricted to specific roles.
    </p>

    <!-- Current roles -->
    <div *ngIf="roles().length > 0" style="
      background: #f8fafc; border: 1px solid var(--bp-border);
      border-radius: 0.625rem; padding: 0.875rem 1rem;
      margin-bottom: 1.5rem; font-size: 0.8125rem;
    ">
      <span style="color: var(--bp-text-muted);">Your current role: </span>
      <span *ngFor="let r of roles(); let last = last" style="font-weight: 600; color: var(--bp-primary);">
        {{ r }}<span *ngIf="!last">, </span>
      </span>
    </div>

    <!-- Actions -->
    <div style="display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap;">
      <a routerLink="/" class="bp-btn bp-btn-primary">← Go Home</a>
      <a routerLink="/projects" class="bp-btn bp-btn-ghost">My Projects</a>
    </div>
  </div>
</div>
