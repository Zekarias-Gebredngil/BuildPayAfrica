name: Build and Publish to Docker Hub

on:
  push:
    branches: [ "main" ] # Runs when you push to the main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      # This matrix runs all builds at the same time
      matrix:
        include:
          - service_name: buildpay-api
            dockerfile: BuildPay.API/Dockerfile
          - service_name: buildpay-identity
            dockerfile: services/BuildPay.IdentityService/Dockerfile
          - service_name: buildpay-marketplace
            dockerfile: services/BuildPay.MarketplaceService/Dockerfile
          - service_name: buildpay-project
            dockerfile: services/BuildPay.ProjectService/Dockerfile
          - service_name: buildpay-payment
            dockerfile: services/BuildPay.PaymentService/Dockerfile
          - service_name: buildpay-delivery
            dockerfile: services/BuildPay.DeliveryService/Dockerfile
          - service_name: buildpay-notification
            dockerfile: services/BuildPay.NotificationService/Dockerfile
          - service_name: buildpay-userprofile
            dockerfile: services/BuildPay.UserProfileService/Dockerfile
          - service_name: buildpay-gateway
            dockerfile: BuildPay.Gateway/Dockerfile
          - service_name: buildpay-web
            dockerfile: frontend/Dockerfile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # Tags the image with 'latest' and the specific git commit hash
          tags: |
            zesolver/${{ matrix.service_name }}:latest
            zesolver/${{ matrix.service_name }}:${{ github.sha }}
          # Uses cache to make subsequent builds faster
          cache-from: type=gha
          cache-to: type=gha,mode=max