global:
  scrape_interval: 15s

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: [ "gateway:8080" ]

  - job_name: identity
    metrics_path: /metrics
    static_configs:
      - targets: [ "identity:8080" ]

  - job_name: marketplace
    metrics_path: /metrics
    static_configs:
      - targets: [ "marketplace:8080" ]

  - job_name: project
    metrics_path: /metrics
    static_configs:
      - targets: [ "project:8080" ]

  - job_name: payment
    metrics_path: /metrics
    static_configs:
      - targets: [ "payment:8080" ]

  - job_name: delivery
    metrics_path: /metrics
    static_configs:
      - targets: [ "delivery:8080" ]

  - job_name: notification
    metrics_path: /metrics
    static_configs:
      - targets: [ "notification:8080" ]

  - job_name: userprofile
    metrics_path: /metrics
    static_configs:
      - targets: [ "userprofile:8080" ]

