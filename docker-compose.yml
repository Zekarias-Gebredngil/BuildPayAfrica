version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: buildpay-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Password123!
      POSTGRES_DB: buildpay_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - buildpay-network

  redis:
    image: redis:7-alpine
    container_name: buildpay-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - buildpay-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: buildpay-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: Password123!
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      - db
    command: start-dev --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    networks:
      - buildpay-network

volumes:
  postgres_data:
  redis_data:

networks:
  buildpay-network:
    driver: bridge
