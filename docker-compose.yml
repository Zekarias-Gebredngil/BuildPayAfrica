version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: buildpay-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Password123!
      POSTGRES_DB: buildpay_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - buildpay-network

  redis:
    image: redis:7-alpine
    container_name: buildpay-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - buildpay-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: buildpay-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: Password123!
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      - db
    command: start-dev --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    networks:
      - buildpay-network

  api:
    build:
      context: .
      dockerfile: BuildPay.API/Dockerfile
    container_name: buildpay-api
    environment:
      ASPNETCORE_URLS: http://+:8081
      ConnectionStrings__DefaultConnection: Host=db;Database=buildpay_db;Username=postgres;Password=Password123!
      Keycloak__Authority: http://keycloak:8080/realms/buildpay
      Keycloak__Audience: buildpay-api
      Keycloak__BaseUrl: http://keycloak:8080
      Keycloak__Realm: buildpay
      Keycloak__AdminRealm: master
      Keycloak__AdminClientId: admin-cli
      Keycloak__AdminUsername: admin
      Keycloak__AdminPassword: admin
      Keycloak__PublicClientId: buildpay-web
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      keycloak:
        condition: service_healthy
    restart: on-failure
    networks:
      - buildpay-network

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: buildpay-web
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - buildpay-network

volumes:
  postgres_data:
  redis_data:

networks:
  buildpay-network:
    driver: bridge
